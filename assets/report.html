<!doctype html>
<html lang="@@lang@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@text_title@@</title>
<style>
:root{color-scheme:light;--ink:#172e36;--sub:#4d646b;--line:#d8e3e1;--bg:#edf4f1;--brand:#136f5a}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:#102f39;color:white;padding:2rem max(5vw,1rem)}h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:.15rem 0}.kicker{color:#9ce3ca}
main{width:min(1260px,94vw);margin:1.5rem auto}.notice{padding:.8rem 1rem;border-left:4px solid #be8524;background:#fff4dc}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin:1rem 0}.card,section{background:white;border:1px solid var(--line);border-radius:.65rem;padding:1rem}
.card strong{display:block;font-size:1.75rem}.card span,.meta,footer{color:var(--sub)}nav{display:flex;gap:.65rem;margin:1rem 0;flex-wrap:wrap}
button,select{padding:.6rem .8rem;background:white;color:var(--ink);border:1px solid #a4b8b3;border-radius:.35rem;font:inherit}
button[aria-selected=true]{background:var(--brand);color:white}button{cursor:pointer}a{color:var(--brand)}h2{margin:.15rem 0 .75rem;font-size:1.15rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}.scroll{overflow:auto;max-height:470px}table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{border-bottom:1px solid var(--line);padding:.55rem .5rem;text-align:left;vertical-align:top}th{color:var(--sub);background:white;position:sticky;top:0}
td{font-variant-numeric:tabular-nums}.reconciled{color:#087253;font-weight:650}.exception{color:#9a4218;font-weight:650}
footer{padding:1rem 0;font-size:.85rem}section+section{margin-top:.85rem}.grid section+section{margin-top:0}
@media(max-width:800px){.cards,.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}}
.language{padding:.45rem max(1rem,5vw);background:#fff}.language a{color:#075e57;font:600 14px/1.5 system-ui,sans-serif;text-underline-offset:.18em}
</style>
</head>
<body><div class="language"><a href="@@other_file@@" hreflang="@@other_lang@@" lang="@@other_lang@@">@@other_label@@</a></div>
<header><div class="kicker">@@text_brand@@</div><h1>@@text_heading@@</h1><div>@@text_units@@</div></header>
<main>
<p class="notice">@@text_notice@@</p>
<div class="cards" id="cards"></div>
<nav role="tablist" aria-label="@@text_views@@">
<button role="tab" id="tab-lots" aria-controls="lots" aria-selected="true">@@text_payouts@@</button>
<button role="tab" id="tab-queue" aria-controls="queue" aria-selected="false">@@text_queue@@</button>
<button role="tab" id="tab-trace" aria-controls="trace" aria-selected="false">@@text_trace@@</button>
</nav>
<div id="lots" role="tabpanel" aria-labelledby="tab-lots">
<section><h2>@@text_lot_state@@</h2>
<label>@@text_state@@ <select id="filter"><option value="">@@text_all@@</option><option value="reconciled">@@text_reconciled@@</option><option value="exception">@@text_exception@@</option><option value="provisional">@@text_provisional@@</option></select></label>
<div class="scroll" id="payout-table"></div><p class="meta" id="payout-count"></p>
<a href="payouts.csv">@@text_payout_csv@@</a> · <a href="invoices.csv">@@text_invoice_csv@@</a>
</section></div>
<div id="queue" role="tabpanel" aria-labelledby="tab-queue" hidden>
<section><h2>@@text_open_issues@@</h2><div class="scroll" id="queue-table"></div>
<p class="meta">@@text_priority@@</p>
<a href="exceptions.csv">@@text_queue_csv@@</a></section>
</div>
<div id="trace" role="tabpanel" aria-labelledby="tab-trace" hidden>
<section><h2 id="focus-title"></h2><p class="meta" id="focus-caption"></p></section>
<div class="grid" style="margin-top:.9rem"><section><h2>@@text_movements@@</h2><div class="scroll" id="movement-table"></div></section>
<section><h2>@@text_deliveries@@</h2><div class="scroll" id="receipt-table"></div></section></div>
<section><h2>@@text_audit@@</h2><div class="scroll" id="audit-table"></div></section>
</div>
<footer>@@text_license@@ <a href="reconciliation.json">@@text_json@@</a> · <span id="generated"></span></footer>
</main>
<script type="application/json" id="payload">@@PAYLOAD@@</script>
<script id="report-copy" type="application/json">@@js_copy@@</script>
<script>
const copy=JSON.parse(document.getElementById('report-copy').textContent);
const data=JSON.parse(document.getElementById('payload').textContent);
const el=id=>document.getElementById(id);
const number=value=>value===null||value===undefined?'—':Number(value).toLocaleString(copy.js_locale);
const states={reconciled:copy.js_reconciled,exception:copy.js_exception,provisional:copy.js_provisional};
const displayCodes={
  event_type:{capture:copy.js_capture,refund:copy.js_refund,fee:copy.js_fee},
  action:{projection:copy.js_projection,resolution:copy.js_resolution},
  code:{
    event_payload_conflict:copy.js_event_payload_conflict,
    missing_declared_effect:copy.js_missing_declared_effect,
    missing_invoice:copy.js_missing_invoice,
    payout_mismatch:copy.js_payout_mismatch,
    refunds_exceed_capture:copy.js_refunds_exceed_capture
  },
  reason:{
    'Recomputed from immutable receipts':copy.js_recomputed,
    'La declaración revisada coincide con captura, devolución y comisión.':copy.js_demo_resolution
  }
};
function table(id, rows, cols){
  const root=el(id), output=document.createElement('table'), head=output.createTHead().insertRow();
  for(const [,label] of cols){const item=document.createElement('th');item.scope='col';item.textContent=label;head.append(item)}
  const body=output.createTBody();
  for(const row of rows){const tr=body.insertRow();for(const [key] of cols){
    const cell=tr.insertCell(), value=row[key];
    const entries=displayCodes[key];
    const display=entries && Object.hasOwn(entries,value) ? entries[value] : undefined;
    cell.textContent=key==='state'?(states[value]??value):key.endsWith('_minor')?number(value):display??value??'—';
    if(display && display!==value)cell.title=value;
    if(key==='state')cell.className=value;
  }}
  if(!rows.length){const cell=body.insertRow().insertCell();cell.colSpan=cols.length;cell.textContent=copy.js_empty}
  root.replaceChildren(output);
}
const m=data.metrics;
for(const [value,label] of [[m.receipts,copy.js_audited],[m.lot_states.reconciled??0,copy.js_matches],[m.open_issues,copy.js_open],[m.identical_payload_repeats,copy.js_duplicates]]){
  const card=document.createElement('div'), strong=document.createElement('strong'), title=document.createElement('span');
  card.className='card'; strong.textContent=number(value); title.textContent=label; card.append(strong,title);el('cards').append(card)
}
const tabs=[...document.querySelectorAll('[role=tab]')];
function selectTab(selected){for(const tab of tabs){
  const active=tab===selected;tab.setAttribute('aria-selected',active);tab.tabIndex=active?0:-1;el(tab.getAttribute('aria-controls')).hidden=!active;
}}
tabs.forEach((tab,index)=>{
  tab.addEventListener('click',()=>selectTab(tab));
  tab.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight'].includes(event.key))return;
    event.preventDefault();const next=tabs[(index+tabs.length+(event.key==='ArrowRight'?1:-1))%tabs.length];
    selectTab(next);next.focus();
  });
});
selectTab(tabs[0]);
function renderPayouts(){
  const chosen=el('filter').value;
  const rows=data.snapshot.payouts.filter(p=>!chosen||p.state===chosen);
  table('payout-table',rows.slice(0,100),[['payout_id',copy.js_payout],['state',copy.js_state],['expected_minor',copy.js_expected],['declared_minor',copy.js_declared],['difference_minor',copy.js_difference]]);
  el('payout-count').textContent=number(Math.min(rows.length,100))+copy.js_of+number(rows.length)+copy.js_filtered;
}
el('filter').addEventListener('change',renderPayouts);renderPayouts();
table('queue-table',data.exceptions.slice(0,100),[['payout_id',copy.js_payout],['code',copy.js_reason],['subject',copy.js_reference],['difference_minor',copy.js_difference],['opened_at',copy.js_first_seen]]);
const focus=data.detail;
el('focus-title').textContent=focus?copy.js_payout_prefix+focus.payout_id:copy.js_no_focus;
el('focus-caption').textContent=focus?(states[focus.state]+' · '+number(focus.expected_minor)+copy.js_expected_suffix+number(focus.declared_minor)+copy.js_declared_suffix):copy.js_cli;
table('movement-table',focus?.movements??[],[['event_type',copy.js_type],['effect_id',copy.js_effect],['signed_minor',copy.js_signed]]);
table('receipt-table',focus?.receipts??[],[['position',copy.js_position],['event_id',copy.js_event],['received_at',copy.js_received]]);
table('audit-table',(focus?.audit??[]).map(a=>({...a,reference:a.evidence.evidence_effect_id??a.evidence.statement_effect_id})),
  [['action',copy.js_action],['actor',copy.js_role],['reason',copy.js_reason],['reference',copy.js_evidence]]);
el('generated').textContent=data.generated_at;
</script>
</body>
</html>
