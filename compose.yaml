name: faro-reconciliation
services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: faro_reconcile
      POSTGRES_DB: faro_reconcile
      POSTGRES_PASSWORD: ${FARO2_DB_PASSWORD:?Set a local password in .env}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - reconciliation_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faro_reconcile -d faro_reconcile"]
      interval: 3s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      FARO2_DB_HOST: postgres
      FARO2_DB_PORT: "5432"
      FARO2_DB_PASSWORD: ${FARO2_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - reconciliation_output:/out
volumes:
  reconciliation_pg:
  reconciliation_output:
